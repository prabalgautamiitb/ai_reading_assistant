[project]
name = "ai-reading-assistant"
version = "0.1.0"
description = "Selected-text AI explainer MVP with FastAPI, LangChain, and Ollama."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.1",
    "langchain-core>=0.2.0",
    "langchain-ollama>=0.1.0",
    "httpx>=0.27.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "pynput>=1.7.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "desktop_client*"]
